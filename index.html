<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SO-KIT — Maillots rétro</title>

    <meta name="description" content="SO-KIT — Maillots rétro de football">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="header">

    <div class="logo">
        <img src="images/logo (2).png" alt="SO-KIT">
        <p>Maillots rétro</p>
    </div>

    <nav class="navigation">
        <a href="#">Accueil</a>
        <a href="#">Maillots</a>
        <a href="#">Contact</a>
        <a href="#">🛒</a>
    </nav>

</header>


<!-- GRANDE BANNIÈRE -->

<section class="banniere-principale">

    <div class="banniere-contenu">

        <span class="badge">⚽ COLLECTION RÉTRO</span>

        <h1>Maillot rétro 2016/2017</h1>

        <p>
            Découvrez nos maillots rétro
        </p>

    </div>

</section>


<!-- PETITE BANNIÈRE -->

<section class="banniere-secondaire">

    <span class="badge">🏷️ NOUVELLE COLLECTION</span>

    <p>Découvrez nos maillots rétro</p>

</section>


<!-- PRODUIT -->

<main class="produit">

    <div class="photo">

        <img
            src="images/IMG_3039.jpeg"
            alt="Maillot rétro 2016/2017"
        >

    </div>


    <div class="infos">

    <div class="note">
    ⭐⭐⭐⭐⭐
    <strong>4,8/5</strong>
    <span>(46 avis)</span>
</div>

        <h2>Maillot rétro 2016/2017</h2>

        <div class="prix">
            39,90 €
        </div>


        <!-- TAILLE -->

        <label for="taille">
            Taille
        </label>

        <select id="taille">

            <option>S</option>
            <option>M</option>
            <option>L</option>
            <option>XL</option>
            <option>XXL</option>

        </select>


        <!-- FLOÇAGE -->

        <label class="flocage">

            <input
                type="checkbox"
                id="flocage"
            >

            Ajouter un flocage personnalisé
            <strong>(+1 €)</strong>

        </label>


        <div id="zoneFlocage">

            <input
                type="text"
                id="nom"
                placeholder="Nom"
            >

            <input
                type="number"
                id="numero"
                placeholder="Numéro"
            >

        </div>


        <!-- LIVRAISON -->

        <div class="livraison">

            <h3>Livraison</h3>

            <label class="option-livraison">

                <input
                    type="radio"
                    name="livraison"
                    value="0"
                    checked
                >

                <span>
                    Livraison standard
                </span>

                <strong>
                    Gratuite
                </strong>

            </label>


            <label class="option-livraison">

                <input
                    type="radio"
                    name="livraison"
                    value="3.90"
                >

                <span>
                    Livraison express (4 jours)
                </span>

                <strong>
                    3,90 €
                </strong>

            </label>

        </div>


        <!-- TOTAL -->

        <div class="total">

            <span>Total</span>

            <strong id="prixFinal">
                39,90 €
            </strong>

        </div>


        <!-- BOUTON -->

        <button id="commander">

            🛒 AJOUTER AU PANIER

        </button>

    </div>

</main>


<footer>

    <p>© 2026 SO-KIT — Maillots rétro</p>

</footer>


<script src="js/app.js"></script>

</body>

</html>
